# Agent gateway: Markdown content negotiation in front of GitHub Pages.
# Deploy from the repository root with:
#   npx wrangler@4 deploy --config edge/wrangler.toml
name = "bretthaas-agent-gateway"
main = "worker.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "www.bretthaas.com/*", zone_name = "bretthaas.com" },
]
